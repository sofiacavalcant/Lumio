<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lumio — Transações</title>
  <link rel="stylesheet" href="../sass/main.css" />
</head>
<body>

<div class="page-wrapper">

  <nav class="navbar">
    <span class="navbar__logo">Lumio</span>
    <ul class="navbar__links">
      <li><a href="dashboard.html">Dashboard</a></li>
      <li><a href="transacoes.html" class="active">Transações</a></li>
      <li><a href="assessor.html">Assessor</a></li>
      <li><a href="relatorios.html">Relatórios</a></li>
    </ul>
    <div class="navbar__avatar">JL</div>
  </nav>

  <main class="main-content">

    <div class="page-header">
      <h2 class="page-header__title">Transações</h2>
      <button class="btn btn--primary" onclick="abrirModal()">+ Nova transação</button>
    </div>

    <!-- FILTROS -->
    <div class="filters-row">
      <input type="month" id="filtro-mes" value="2026-03" onchange="filtrar()" />
      <select id="filtro-categoria" onchange="filtrar()">
        <option value="">Todas as categorias</option>
        <option>Alimentação</option>
        <option>Transporte</option>
        <option>Lazer</option>
        <option>Saúde</option>
        <option>Outros</option>
      </select>
      <select id="filtro-tipo" onchange="filtrar()">
        <option value="">Todos os tipos</option>
        <option value="receita">Receita</option>
        <option value="despesa">Despesa</option>
      </select>
    </div>

    <!-- TABELA -->
    <div class="card" style="padding:0;overflow:hidden;">
      <table class="transactions-table" id="tabela">
        <thead>
          <tr>
            <th>Descrição</th>
            <th>Categoria</th>
            <th>Data</th>
            <th>Valor</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="tbody">
          <!-- preenchido pelo JS -->
        </tbody>
      </table>
    </div>

    <!-- PAGINAÇÃO -->
    <div class="pagination" id="paginacao"></div>

  </main>
</div>

<!-- MODAL NOVA TRANSAÇÃO -->
<div id="modal-overlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.35);z-index:200;align-items:center;justify-content:center;">
  <div style="background:#fff;border-radius:16px;padding:2rem;width:100%;max-width:420px;margin:1rem;">
    <h3 style="font-size:1rem;font-weight:600;margin-bottom:1.25rem;">Nova transação</h3>
    <form id="form-transacao">
      <div class="form-group">
        <label>Tipo</label>
        <select name="tipo" required>
          <option value="despesa">Despesa</option>
          <option value="receita">Receita</option>
        </select>
      </div>
      <div class="form-group">
        <label>Descrição</label>
        <input type="text" name="descricao" placeholder="Ex: Supermercado" required />
      </div>
      <div class="form-group">
        <label>Valor (R$)</label>
        <input type="number" name="valor" min="0.01" step="0.01" placeholder="0,00" required />
      </div>
      <div class="form-group">
        <label>Categoria</label>
        <select name="categoria" required>
          <option>Alimentação</option>
          <option>Transporte</option>
          <option>Lazer</option>
          <option>Saúde</option>
          <option>Outros</option>
        </select>
      </div>
      <div class="form-group">
        <label>Data</label>
        <input type="date" name="data" required />
      </div>
      <div style="display:flex;gap:8px;margin-top:1rem;">
        <button type="button" class="btn btn--outline" style="flex:1;" onclick="fecharModal()">Cancelar</button>
        <button type="submit" class="btn btn--primary" style="flex:1;">Salvar</button>
      </div>
    </form>
  </div>
</div>

<script src="../js/transacoes.js"></script>

</body>
</html>
