<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lumio — Entrar</title>
  <link rel="stylesheet" href="../sass/main.css" />
</head>
<body>

<div class="auth-page">
  <div class="auth-card">
    <div class="auth-card__logo">
      <h1>Lumio</h1>
      <p>Assessor financeiro inteligente</p>
    </div>

    <div class="tabs" id="auth-tabs">
      <button class="tabs__item tabs__item--active" onclick="switchTab('login')">Entrar</button>
      <button class="tabs__item" onclick="switchTab('cadastro')">Criar conta</button>
    </div>

    <!-- FORM LOGIN -->
    <form id="form-login" action="/auth/login" method="POST">
      <div class="form-group">
        <label for="email-login">E-mail</label>
        <input type="email" id="email-login" name="email" placeholder="seu@email.com" required />
      </div>
      <div class="form-group">
        <label for="senha-login">Senha</label>
        <input type="password" id="senha-login" name="senha" placeholder="••••••••" required />
      </div>
      <button type="submit" class="btn btn--primary" style="width:100%;justify-content:center;margin-top:0.5rem;">
        Entrar
      </button>
      <p style="text-align:center;margin-top:1rem;font-size:0.8rem;">
        <a href="/auth/recuperar">Esqueci minha senha</a>
      </p>
    </form>

    <!-- FORM CADASTRO (oculto inicialmente) -->
    <form id="form-cadastro" action="/auth/cadastro" method="POST" style="display:none;">
      <div class="form-group">
        <label for="nome">Nome completo</label>
        <input type="text" id="nome" name="nome" placeholder="Seu nome" required />
      </div>
      <div class="form-group">
        <label for="email-cad">E-mail</label>
        <input type="email" id="email-cad" name="email" placeholder="seu@email.com" required />
      </div>
      <div class="form-group">
        <label for="senha-cad">Senha</label>
        <input type="password" id="senha-cad" name="senha" placeholder="Mínimo 8 caracteres" required />
      </div>
      <button type="submit" class="btn btn--primary" style="width:100%;justify-content:center;margin-top:0.5rem;">
        Criar conta
      </button>
    </form>
  </div>
</div>

<script>
  function switchTab(tab) {
    const tabs = document.querySelectorAll('.tabs__item');
    const formLogin = document.getElementById('form-login');
    const formCad   = document.getElementById('form-cadastro');

    if (tab === 'login') {
      tabs[0].classList.add('tabs__item--active');
      tabs[1].classList.remove('tabs__item--active');
      formLogin.style.display = '';
      formCad.style.display   = 'none';
    } else {
      tabs[1].classList.add('tabs__item--active');
      tabs[0].classList.remove('tabs__item--active');
      formLogin.style.display = 'none';
      formCad.style.display   = '';
    }
  }
</script>

</body>
</html>
